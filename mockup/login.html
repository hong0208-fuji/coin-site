<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · coin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-wrap">
  <div class="card login-card">
    <div class="logo">coin</div>
    <div class="tagline">바이낸스 AI 자동매매</div>

    <form>
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" placeholder="아이디 입력" />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력" />
      </div>
      <button type="button" class="btn btn-go">로그인</button>
    </form>

    <div class="footnote">본인만 사용하는 개인용 서비스입니다.</div>
  </div>
</div>

</body>
</html>
