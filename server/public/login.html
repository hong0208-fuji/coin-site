<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · coin</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

<div class="login-wrap">
  <div class="card login-card">
    <div class="logo">coin</div>
    <div class="tagline">바이낸스 AI 자동매매</div>

    <form id="login-form">
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="아이디 입력" required />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required />
      </div>
      <div id="error" class="error-text"></div>
      <button type="submit" class="btn btn-go" id="submit-btn">로그인</button>
    </form>

    <div class="footnote">본인만 사용하는 개인용 서비스입니다.</div>
  </div>
</div>

<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    submitBtn.disabled = true;

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        window.location.href = "/dashboard";
      } else {
        errorEl.textContent = data.error || "로그인에 실패했습니다.";
      }
    } catch (err) {
      errorEl.textContent = "서버에 연결할 수 없습니다.";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
